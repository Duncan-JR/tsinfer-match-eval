[project]
name = "tsinfer-match-eval"
version = "0.1.0"
description = "Evaluate tsinfer matching with inferred and true ancestor panels."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "numcodecs",
    "pandas",
    "psutil",
    "pyyaml",
    "snakemake>=9",
    "tomli-w",
    "tsinfer",
    "tsls",
    "tskit>=1",
    "zarr>=3",
    "numba",
    "tszip>=0.3.1",
]


[tool.uv]
package = false

[tool.uv.sources]
tsinfer = { git = "file:///Users/duncan/work/tsinfer", rev = "e2f8de7c950179215ece27e1d31c7b096308b4c8" }
tsls = { git = "file:///Users/duncan/work/tsls", rev = "c560b405761ae09625e266d39c2356ccc4b54b69" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[tool.ruff]
line-length = 89
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "N", "UP", "A", "PLC0415"]
