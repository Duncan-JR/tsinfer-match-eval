[project]
name = "tsinfer-match-eval"
version = "0.1.0"
description = "Evaluate tsinfer matching with inferred and true ancestor panels."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "numcodecs",
    "pandas",
    "psutil",
    "pyyaml",
    "snakemake>=9",
    "tomli-w",
    "tsinfer",
    "tsls",
    "tskit>=1",
    "zarr>=3",
    "numba",
    "tszip>=0.3.1",
]


[tool.uv]
package = false
# Override tsinfer's older transitive Git pin with the same TSLS as this runner.
override-dependencies = [
    "tsls @ git+file:///well/kelleher/users/uuc395/tsls@e4cf2333b99eb6b104ff44cbb34625f22a16e880",
]

[tool.uv.sources]
tsinfer = { git = "file:///well/kelleher/users/uuc395/tsinfer", rev = "63837fd44b661714c774c3c5957904eea25d7210" }
tsls = { git = "file:///well/kelleher/users/uuc395/tsls", rev = "e4cf2333b99eb6b104ff44cbb34625f22a16e880" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[tool.ruff]
line-length = 89
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "N", "UP", "A", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
