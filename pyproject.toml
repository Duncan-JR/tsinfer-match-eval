[project]
name = "tsinfer-match-eval"
version = "0.1.0"
description = "Evaluate tsinfer matching with inferred and true ancestor panels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "numcodecs",
    "pandas",
    "pyyaml",
    "snakemake>=9",
    "tomli-w",
    "tsinfer",
    "tskit>=1",
    "zarr>=3",
    "numba",
]


[tool.uv]
package = false

[tool.uv.sources]
tsinfer = { path = "../tsinfer", editable = true }

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 89
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "N", "UP", "A", "PLC0415"]
